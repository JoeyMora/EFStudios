[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artist-email-finder"
version = "0.1.0"
description = "Find public contact emails for music artists (EF Studios)."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "flask>=3.0",
    "anthropic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
artist-email-finder = "artist_email_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artist_email_finder = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
