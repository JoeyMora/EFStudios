<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Artist Finder{% endblock %} · EF Studios</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></symbol>
  <symbol id="i-tiktok" viewBox="0 0 24 24"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.6 2.3 4.5 5 4.8"/></symbol>
  <symbol id="i-youtube" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></symbol>
  <symbol id="i-spotify" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7.5 9.5c3-1 6.5-.8 9.2.7M8 12.6c2.5-.7 5.3-.5 7.6.8M8.6 15.5c2-.5 4-.3 5.8.6"/></symbol>
  <symbol id="i-web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3.5" y="4" width="4.5" height="16" rx="1.5"/><rect x="9.75" y="4" width="4.5" height="11" rx="1.5"/><rect x="16" y="4" width="4.5" height="7" rx="1.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></symbol>
</svg>
<nav class="top">
  <a class="brand" href="{{ url_for('leads') }}">EF Studios · Artist Finder</a>
  <a class="tab {% if request.endpoint in ('leads', 'lead') %}on{% endif %}" href="{{ url_for('leads') }}">Leads</a>
  <a class="tab {% if request.endpoint == 'find' %}on{% endif %}" href="{{ url_for('find') }}">Find artists</a>
  <a class="tab {% if request.endpoint == 'settings_page' %}on{% endif %}" href="{{ url_for('settings_page') }}">My level &amp; settings</a>
  <span id="jobs-indicator"></span>
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script>
async function copyText(btn, text) {
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
    t.select(); document.execCommand('copy'); t.remove();
  }
  const old = btn.innerHTML; btn.textContent = 'Copied'; setTimeout(() => btn.innerHTML = old, 1200);
}
async function updateLead(id, data) {
  await fetch('/api/lead/' + id, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
}
let jobsWereRunning = false;
async function pollJobs() {
  try {
    const jobs = await (await fetch('/api/jobs')).json();
    const running = jobs.filter(j => j.status === 'running' || j.status === 'queued');
    const el = document.getElementById('jobs-indicator');
    if (running.length) {
      const j = running.find(j => j.status === 'running') || running[0];
      el.innerHTML = '<span class="spin"></span>' + (j.message || j.kind).replace(/</g, '&lt;') +
        (running.length > 1 ? ' (+' + (running.length - 1) + ' queued)' : '');
    } else {
      el.textContent = '';
    }
    if (window.onJobs) window.onJobs(jobs);
    if (jobsWereRunning && !running.length && window.reloadWhenJobsFinish) location.reload();
    jobsWereRunning = running.length > 0;
  } catch (e) {}
}
pollJobs(); setInterval(pollJobs, 2500);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
